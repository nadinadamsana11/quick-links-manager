<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortcuts Manager - Ultimate Space Edition</title>
    <link rel="icon" href="/quick-links-manager/favicon.svg" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --bg-dark: #09090b;
            --card-bg: #18181b;
            --accent-blue: #3b82f6;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: #fafafa;
            overflow: hidden; 
        }

        .glass-panel {
            background: rgba(15, 15, 18, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
        }

        .shortcut-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        .shortcut-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.4);
            background: #1c1c21;
        }

        .shortcut-card.dragging {
            opacity: 0.5;
            transform: scale(1.05);
            border-color: #fbbf24;
        }

        .shortcut-card.favorite {
            border-color: #fbbf24;
        }

        .shortcut-card.favorite::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
        }

        .dropdown-animate {
            animation: scaleIn 0.2s ease-out;
            transform-origin: top center;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .btn-premium {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.2s;
        }

        .btn-premium:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            transition: opacity 0.3s ease;
        }

        .search-highlight {
            background: rgba(59, 130, 246, 0.3);
            border-radius: 2px;
        }

        .color-picker-option {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .color-picker-option:hover {
            transform: scale(1.2);
        }

        .color-picker-option.selected {
            border-color: white;
            box-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        .icon-picker-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .icon-picker-option {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-picker-option:hover {
            background: rgba(59, 130, 246, 0.3);
        }

        .icon-picker-option.selected {
            background: rgba(59, 130, 246, 0.5);
            border: 2px solid #3b82f6;
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Premium Header -->
    <header class="h-16 border-b border-white/5 bg-zinc-950/70 backdrop-blur-md flex items-center justify-between px-4 sm:px-8 shrink-0 z-40">
        
        <!-- Left: Time Display & Search -->
        <div class="flex items-center gap-3 w-1/4">
            <div id="dateTimeDisplay" class="text-[10px] font-bold text-zinc-400 uppercase tracking-[0.15em] font-mono">
                Loading...
            </div>
            <div class="relative ml-4">
                <input type="text" id="searchInput" onkeyup="filterShortcuts()" placeholder="Search..." 
                    class="w-48 px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-[10px] text-white outline-none focus:border-blue-500 transition-all">
                <i class="fa-solid fa-search absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-zinc-500"></i>
            </div>
        </div>

        <!-- Center: Space Selector -->
        <div class="relative dropdown-container flex justify-center w-2/4">
            <button onclick="toggleSpacesMenu(event)" class="group flex items-center gap-3 px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 transition-all active:scale-95">
                <i class="fa-solid fa-folder-tree text-blue-500 text-xs"></i>
                <span id="currentSpaceTitle" class="text-xs font-extrabold text-zinc-100 tracking-wide truncate max-w-[100px] sm:max-w-[200px]">Home</span>
                <i class="fa-solid fa-caret-down text-[10px] text-zinc-500 group-hover:text-zinc-300"></i>
            </button>

            <!-- Spaces List Dropdown -->
            <div id="spacesMenu" class="hidden dropdown-animate absolute top-full mt-3 w-64 glass-panel rounded-2xl z-50 overflow-hidden shadow-2xl border border-white/10">
                <div class="p-3 border-b border-white/5 bg-white/[0.02]">
                    <span class="text-[9px] font-black text-zinc-500 uppercase px-2 tracking-widest">Available Spaces</span>
                </div>
                <div id="spacesList" class="max-h-80 overflow-y-auto py-2 custom-scroll"></div>
                <div class="p-3 bg-zinc-900/40">
                    <button onclick="openNewSpaceModal()" class="w-full flex items-center justify-center gap-2 py-2.5 text-[10px] font-black text-blue-400 hover:text-blue-300 rounded-lg transition-all">
                        <i class="fa-solid fa-plus-circle"></i> ADD NEW SPACE
                    </button>
                </div>
            </div>
        </div>

        <!-- Right: Pagination & Actions -->
        <div class="flex items-center gap-2 sm:gap-4 w-1/4 justify-end">
            <!-- Pagination Controls -->
            <div class="hidden sm:flex items-center bg-white/5 rounded-lg px-1 py-1 border border-white/5 mr-2">
                <button onclick="prevPage()" id="prevBtn" class="p-2 text-zinc-500 hover:text-white disabled:opacity-10 transition">
                    <i class="fa-solid fa-chevron-left text-[10px]"></i>
                </button>
                <span id="pageIndicator" class="text-[9px] font-black text-zinc-400 px-2 min-w-[40px] text-center">1/1</span>
                <button onclick="nextPage()" id="nextBtn" class="p-2 text-zinc-500 hover:text-white disabled:opacity-10 transition">
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
            </div>

            <button onclick="openSpaceSettings()" class="p-2 text-zinc-500 hover:text-white transition-all">
                <i class="fa-solid fa-sliders text-sm"></i>
            </button>

            <button onclick="openAddModal()" class="btn-premium p-2 sm:px-4 sm:py-2 rounded-xl text-white">
                <i class="fa-solid fa-plus text-[10px]"></i>
                <span class="hidden lg:inline ml-2 text-[10px] font-black tracking-widest">ADD</span>
            </button>
        </div>
    </header>

    <!-- Main Grid Container -->
    <main id="mainContent" class="flex-1 p-6 sm:p-10 relative">
        <div id="shortcutsContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-7 gap-6">
            <!-- Shortcuts render here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center absolute inset-0 text-zinc-700">
            <div class="w-20 h-20 rounded-full bg-white/[0.02] flex items-center justify-center mb-4">
                <i class="fa-solid fa-ghost text-2xl opacity-20"></i>
            </div>
            <p class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">Space Empty</p>
        </div>
    </main>

    <!-- Modals -->
    <!-- Modal: New Space -->
    <div id="newSpaceModal" onclick="closeOnOverlay(event, 'newSpaceModal')" class="fixed inset-0 modal-overlay z-[100] hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-8" onclick="event.stopPropagation()">
            <h2 class="text-xs font-black text-white uppercase tracking-widest mb-6"><i class="fa-solid fa-circle-plus text-blue-500 mr-2"></i>New Space</h2>
            <input type="text" id="spaceNameInput" placeholder="Name..." class="w-full p-4 bg-zinc-900 border border-white/5 text-white rounded-2xl outline-none focus:border-blue-500 text-sm mb-6">
            <div class="flex gap-3">
                <button onclick="closeSpaceModal()" class="flex-1 py-3 bg-zinc-800 text-zinc-400 rounded-xl font-bold text-[10px]">CANCEL</button>
                <button onclick="createNewSpace()" class="flex-1 py-3 btn-premium text-white rounded-xl font-bold text-[10px]">CREATE</button>
            </div>
        </div>
    </div>

    <!-- Modal: Settings -->
    <div id="spaceSettingsModal" onclick="closeOnOverlay(event, 'spaceSettingsModal')" class="fixed inset-0 modal-overlay z-[100] hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-8 text-white" onclick="event.stopPropagation()">
            <h2 class="text-xs font-black uppercase mb-6"><i class="fa-solid fa-gear mr-2"></i>Settings</h2>
            <input type="text" id="editSpaceNameInput" class="w-full p-4 bg-zinc-900 border border-white/5 rounded-2xl text-sm mb-6">
            <div class="flex gap-3 mb-6">
                <button onclick="closeSpaceSettings()" class="flex-1 py-3 bg-zinc-800 text-[10px] rounded-xl font-bold">CLOSE</button>
                <button onclick="updateSpaceName()" class="flex-1 py-3 btn-premium text-[10px] rounded-xl font-bold">UPDATE</button>
            </div>
            <button onclick="confirmDeleteSpace()" id="delBtn" class="w-full py-3 bg-red-500/10 text-red-500 text-[10px] font-bold rounded-xl hover:bg-red-500 hover:text-white transition">DELETE SPACE</button>
        </div>
    </div>

    <!-- Modal: Add/Edit Shortcut -->
    <div id="shortcutModal" onclick="closeOnOverlay(event, 'shortcutModal')" class="fixed inset-0 modal-overlay z-[100] hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl overflow-hidden" onclick="event.stopPropagation()">
            <div class="p-8 space-y-6">
                <h2 id="shortcutModalHeader" class="text-xs font-black text-white uppercase tracking-widest">Shortcut Details</h2>
                <input type="hidden" id="editId">
                <input type="text" id="siteName" placeholder="Name" class="w-full p-4 bg-zinc-900 border border-white/5 text-white rounded-2xl outline-none text-sm">
                <input type="text" id="siteUrl" placeholder="URL" class="w-full p-4 bg-zinc-900 border border-white/5 text-white rounded-2xl outline-none text-sm">
                
                <!-- Icon Picker -->
                <div>
                    <label class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest mb-2 block">Icon</label>
                    <div class="icon-picker-grid" id="iconPicker">
                        <div class="icon-picker-option selected" data-icon="fa-link"><i class="fa-solid fa-link text-zinc-400"></i></div>
                        <div class="icon-picker-option" data-icon="fa-globe"><i class="fa-solid fa-globe text-zinc-400"></i></div>
                        <div class="icon-picker-option" data-icon="fa-code"><i class="fa-solid fa-code text-zinc-400"></i></div>
                        <div class="icon-picker-option" data-icon="fa-gamepad"><i class="fa-solid fa-gamepad text-zinc-400"></i></div>
                        <div class="icon-picker-option" data-icon="fa-book"><i class="fa-solid fa-book text-zinc-400"></i></div>
                        <div class="icon-picker-option" data-icon="fa-music"><i class="fa-solid fa-music text-zinc-400"></i></div>
                        <div class="icon-picker-option" data-icon="fa-video"><i class="fa-solid fa-video text-zinc-400"></i></div>
                        <div class="icon-picker-option" data-icon="fa-camera"><i class="fa-solid fa-camera text-zinc-400"></i></div>
                        <div class="icon-picker-option" data-icon="fa-shopping-cart"><i class="fa-solid fa-shopping-cart text-zinc-400"></i></div>
                        <div class="icon-picker-option" data-icon="fa-newspaper"><i class="fa-solid fa-newspaper text-zinc-400"></i></div>
                        <div class="icon-picker-option" data-icon="fa-cloud"><i class="fa-solid fa-cloud text-zinc-400"></i></div>
                        <div class="icon-picker-option" data-icon="fa-heart"><i class="fa-solid fa-heart text-zinc-400"></i></div>
                    </div>
                </div>

                <!-- Color Picker -->
                <div>
                    <label class="text-[9px] font-bold text-zinc-500 uppercase tracking-widest mb-2 block">Accent Color</label>
                    <div class="flex gap-2" id="colorPicker">
                        <div class="color-picker-option selected" data-color="#3b82f6" style="background: #3b82f6;"></div>
                        <div class="color-picker-option" data-color="#ef4444" style="background: #ef4444;"></div>
                        <div class="color-picker-option" data-color="#22c55e" style="background: #22c55e;"></div>
                        <div class="color-picker-option" data-color="#eab308" style="background: #eab308;"></div>
                        <div class="color-picker-option" data-color="#a855f7" style="background: #a855f7;"></div>
                        <div class="color-picker-option" data-color="#ec4899" style="background: #ec4899;"></div>
                        <div class="color-picker-option" data-color="#06b6d4" style="background: #06b6d4;"></div>
                        <div class="color-picker-option" data-color="#f97316" style="background: #f97316;"></div>
                    </div>
                </div>

                <button onclick="saveShortcut()" class="w-full py-4 btn-premium text-white font-black rounded-2xl text-[10px]">SAVE</button>
            </div>
        </div>
    </div>

    <!-- Modal: Confirm Delete -->
    <div id="confirmModal" onclick="closeOnOverlay(event, 'confirmModal')" class="fixed inset-0 modal-overlay z-[110] hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-xs rounded-3xl p-8 text-center text-white" onclick="event.stopPropagation()">
            <h2 id="confirmTitle" class="text-sm font-black uppercase">Are you sure?</h2>
            <div class="flex gap-3 mt-8">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 bg-zinc-800 text-[10px] rounded-xl">CANCEL</button>
                <button id="confirmBtn" class="flex-1 py-3 bg-red-600 text-[10px] rounded-xl font-bold">CONFIRM</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 glass-panel text-white px-6 py-3 rounded-full opacity-0 translate-y-4 transition-all z-[200]">
        <span id="toastMsg" class="text-[9px] font-black uppercase tracking-widest">Success</span>
    </div>

    <script>
        let currentSpaceId = 'default';
        let currentPage = 1;
        let itemsPerPage = 12;
        let selectedIcon = 'fa-link';
        let selectedColor = '#3b82f6';
        let draggedItem = null;

        document.addEventListener('DOMContentLoaded', () => {
            initStorage();
            updateDateTime();
            setInterval(updateDateTime, 1000);
            calculateGrid();
            renderSpacesList();
            renderShortcuts();
            initIconPicker();
            initColorPicker();
            initDragAndDrop();
            
            window.addEventListener('resize', () => {
                calculateGrid();
                renderShortcuts();
            });

            // Handle Esc key to close modals
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeAllModals();
                }
            });

            window.onclick = (e) => {
                if (!e.target.closest('.dropdown-container')) {
                    document.getElementById('spacesMenu').classList.add('hidden');
                }
            };
        });

        // Close on overlay click
        function closeOnOverlay(event, modalId) {
            if (event.target.id === modalId) {
                document.getElementById(modalId).classList.add('hidden');
            }
        }

        function closeAllModals() {
            const modals = ['newSpaceModal', 'spaceSettingsModal', 'shortcutModal', 'confirmModal'];
            modals.forEach(id => document.getElementById(id).classList.add('hidden'));
        }

        function initStorage() {
            if (!localStorage.getItem('spaces')) localStorage.setItem('spaces', JSON.stringify([{ id: 'default', name: 'Home' }]));
            if (!localStorage.getItem('shortcuts_by_space')) localStorage.setItem('shortcuts_by_space', JSON.stringify({ 'default': [] }));
            currentSpaceId = localStorage.getItem('last_space_id') || 'default';
        }

        function calculateGrid() {
            const container = document.getElementById('mainContent');
            const width = container.clientWidth - 80;
            const height = container.clientHeight - 80;
            
            let cols = width >= 1536 ? 7 : width >= 1280 ? 5 : width >= 1024 ? 4 : width >= 768 ? 3 : 2;
            let rows = Math.max(1, Math.floor(height / 140));
            itemsPerPage = cols * rows;
        }

        function updateDateTime() {
            const now = new Date();
            document.getElementById('dateTimeDisplay').innerText = now.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }

        function getSpaces() { return JSON.parse(localStorage.getItem('spaces')); }
        function getShortcuts() { return JSON.parse(localStorage.getItem('shortcuts_by_space'))[currentSpaceId] || []; }

        function filterShortcuts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('shortcutsContainer');
            const cards = container.querySelectorAll('.shortcut-card');
            
            cards.forEach(card => {
                const name = card.querySelector('h3').innerText.toLowerCase();
                if (name.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function renderShortcuts() {
            const container = document.getElementById('shortcutsContainer');
            const empty = document.getElementById('emptyState');
            const shortcuts = getShortcuts();
            const totalItems = shortcuts.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

            if (currentPage > totalPages) currentPage = totalPages;
            
            document.getElementById('pageIndicator').innerText = `${currentPage}/${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;

            if (totalItems === 0) {
                container.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            const start = (currentPage - 1) * itemsPerPage;
            const pageItems = shortcuts.slice(start, start + itemsPerPage);

            container.innerHTML = pageItems.map(item => `
                <div class="shortcut-card rounded-2xl p-6 flex flex-col items-center justify-center text-center cursor-pointer group shadow-sm border border-white/5 ${item.favorite ? 'favorite' : ''}" 
                     onclick="window.open('${item.url}', '_blank')"
                     draggable="true"
                     data-id="${item.id}">
                    <div class="absolute top-2 right-2 flex gap-1">
                        <button onclick="event.stopPropagation(); toggleFavorite(${item.id}); return false;" class="p-2 ${item.favorite ? 'text-yellow-500' : 'text-zinc-600'} hover:text-yellow-500 transition opacity-0 group-hover:opacity-100 bg-black/40 rounded-lg">
                            <i class="fa-solid fa-star text-[8px]"></i>
                        </button>
                        <button onclick="event.stopPropagation(); openEditModal(${item.id})" class="p-2 text-zinc-600 hover:text-white transition opacity-0 group-hover:opacity-100 bg-black/40 rounded-lg">
                            <i class="fa-solid fa-pen text-[8px]"></i>
                        </button>
                        <button onclick="event.stopPropagation(); confirmDeleteShortcut(${item.id})" class="p-2 text-zinc-600 hover:text-red-500 transition opacity-0 group-hover:opacity-100 bg-black/40 rounded-lg">
                            <i class="fa-solid fa-trash text-[8px]"></i>
                        </button>
                    </div>
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center mb-3 transition-all" style="background: ${item.color ? item.color + '20' : 'rgba(255,255,255,0.03)'}">
                        <i class="fa-solid ${item.icon || 'fa-link'}" style="color: ${item.color || '#9ca3af'}"></i>
                    </div>
                    <h3 class="font-bold text-zinc-200 text-[10px] uppercase tracking-widest truncate w-full px-2">${item.name}</h3>
                </div>
            `).join('');

            // Re-attach drag events after rendering
            initDragAndDrop();
        }

        function nextPage() { currentPage++; renderShortcuts(); }
        function prevPage() { currentPage--; renderShortcuts(); }

        function toggleSpacesMenu(e) { e.stopPropagation(); document.getElementById('spacesMenu').classList.toggle('hidden'); }

        function switchSpace(id) {
            currentSpaceId = id;
            localStorage.setItem('last_space_id', id);
            currentPage = 1;
            renderSpacesList();
            renderShortcuts();
            document.getElementById('spacesMenu').classList.add('hidden');
            showToast("Switched");
        }

        function renderSpacesList() {
            const spaces = getSpaces();
            document.getElementById('currentSpaceTitle').innerText = spaces.find(s => s.id === currentSpaceId)?.name || 'Home';
            document.getElementById('spacesList').innerHTML = spaces.map(s => `
                <button onclick="switchSpace('${s.id}')" class="w-full px-5 py-3 text-left flex justify-between items-center ${s.id === currentSpaceId ? 'text-blue-400 bg-blue-500/5' : 'text-zinc-500 hover:bg-white/5'}">
                    <span class="text-[10px] font-bold truncate">${s.name}</span>
                    ${s.id === currentSpaceId ? '<i class="fa-solid fa-circle-check text-[10px]"></i>' : ''}
                </button>
            `).join('');
        }

        function openNewSpaceModal() { document.getElementById('newSpaceModal').classList.remove('hidden'); }
        function closeSpaceModal() { document.getElementById('newSpaceModal').classList.add('hidden'); }
        
        function createNewSpace() {
            const name = document.getElementById('spaceNameInput').value.trim();
            if (!name) return;
            const spaces = getSpaces();
            const id = 's_' + Date.now();
            spaces.push({ id, name });
            localStorage.setItem('spaces', JSON.stringify(spaces));
            const store = JSON.parse(localStorage.getItem('shortcuts_by_space'));
            store[id] = [];
            localStorage.setItem('shortcuts_by_space', JSON.stringify(store));
            document.getElementById('spaceNameInput').value = '';
            closeSpaceModal();
            switchSpace(id);
        }

        function openSpaceSettings() {
            const space = getSpaces().find(s => s.id === currentSpaceId);
            document.getElementById('editSpaceNameInput').value = space.name;
            document.getElementById('delBtn').style.display = space.id === 'default' ? 'none' : 'block';
            document.getElementById('spaceSettingsModal').classList.remove('hidden');
        }

        function closeSpaceSettings() { document.getElementById('spaceSettingsModal').classList.add('hidden'); }

        function updateSpaceName() {
            const name = document.getElementById('editSpaceNameInput').value.trim();
            if (!name) return;
            let spaces = getSpaces();
            spaces = spaces.map(s => s.id === currentSpaceId ? {...s, name} : s);
            localStorage.setItem('spaces', JSON.stringify(spaces));
            renderSpacesList();
            closeSpaceSettings();
            showToast("Renamed");
        }

        function confirmDeleteSpace() {
            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmBtn').onclick = () => {
                let spaces = getSpaces().filter(s => s.id !== currentSpaceId);
                localStorage.setItem('spaces', JSON.stringify(spaces));
                let store = JSON.parse(localStorage.getItem('shortcuts_by_space'));
                delete store[currentSpaceId];
                localStorage.setItem('shortcuts_by_space', JSON.stringify(store));
                closeConfirmModal();
                closeSpaceSettings();
                switchSpace('default');
            };
        }

        function openAddModal() {
            document.getElementById('editId').value = '';
            document.getElementById('siteName').value = '';
            document.getElementById('siteUrl').value = '';
            selectedIcon = 'fa-link';
            selectedColor = '#3b82f6';
            updateIconPickerUI();
            updateColorPickerUI();
            document.getElementById('shortcutModal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const item = getShortcuts().find(s => s.id === id);
            document.getElementById('editId').value = id;
            document.getElementById('siteName').value = item.name;
            document.getElementById('siteUrl').value = item.url;
            selectedIcon = item.icon || 'fa-link';
            selectedColor = item.color || '#3b82f6';
            updateIconPickerUI();
            updateColorPickerUI();
            document.getElementById('shortcutModal').classList.remove('hidden');
        }

        function initIconPicker() {
            const iconOptions = document.querySelectorAll('.icon-picker-option');
            iconOptions.forEach(option => {
                option.addEventListener('click', () => {
                    iconOptions.forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    selectedIcon = option.dataset.icon;
                });
            });
        }

        function initColorPicker() {
            const colorOptions = document.querySelectorAll('.color-picker-option');
            colorOptions.forEach(option => {
                option.addEventListener('click', () => {
                    colorOptions.forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    selectedColor = option.dataset.color;
                });
            });
        }

        function updateIconPickerUI() {
            const iconOptions = document.querySelectorAll('.icon-picker-option');
            iconOptions.forEach(option => {
                option.classList.toggle('selected', option.dataset.icon === selectedIcon);
            });
        }

        function updateColorPickerUI() {
            const colorOptions = document.querySelectorAll('.color-picker-option');
            colorOptions.forEach(option => {
                option.classList.toggle('selected', option.dataset.color === selectedColor);
            });
        }

        function toggleFavorite(id) {
            const store = JSON.parse(localStorage.getItem('shortcuts_by_space'));
            let list = store[currentSpaceId];
            list = list.map(s => s.id === id ? {...s, favorite: !s.favorite} : s);
            store[currentSpaceId] = list;
            localStorage.setItem('shortcuts_by_space', JSON.stringify(store));
            renderShortcuts();
            showToast("Updated");
        }

        function initDragAndDrop() {
            const cards = document.querySelectorAll('.shortcut-card[draggable="true"]');
            
            cards.forEach(card => {
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragend', handleDragEnd);
            });
        }

        function handleDragStart(e) {
            draggedItem = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.id);
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDrop(e) {
            e.preventDefault();
            if (draggedItem !== this) {
                const fromId = parseInt(draggedItem.dataset.id);
                const toId = parseInt(this.dataset.id);
                
                const store = JSON.parse(localStorage.getItem('shortcuts_by_space'));
                let list = store[currentSpaceId];
                
                const fromIndex = list.findIndex(s => s.id === fromId);
                const toIndex = list.findIndex(s => s.id === toId);
                
                if (fromIndex !== -1 && toIndex !== -1) {
                    const [removed] = list.splice(fromIndex, 1);
                    list.splice(toIndex, 0, removed);
                    store[currentSpaceId] = list;
                    localStorage.setItem('shortcuts_by_space', JSON.stringify(store));
                    renderShortcuts();
                }
            }
            return false;
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
            draggedItem = null;
        }

        function closeModal() { document.getElementById('shortcutModal').classList.add('hidden'); }

        function saveShortcut() {
            const name = document.getElementById('siteName').value.trim();
            let url = document.getElementById('siteUrl').value.trim();
            const id = document.getElementById('editId').value;
            if (!name || !url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            
            const store = JSON.parse(localStorage.getItem('shortcuts_by_space'));
            let list = store[currentSpaceId];
            if (id) {
                list = list.map(s => s.id == id ? {...s, name, url, icon: selectedIcon, color: selectedColor} : s);
            } else {
                list.push({ id: Date.now(), name, url, icon: selectedIcon, color: selectedColor, favorite: false });
            }
            store[currentSpaceId] = list;
            localStorage.setItem('shortcuts_by_space', JSON.stringify(store));
            closeModal();
            renderShortcuts();
            showToast("Saved");
        }

        function confirmDeleteShortcut(id) {
            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmBtn').onclick = () => {
                const store = JSON.parse(localStorage.getItem('shortcuts_by_space'));
                store[currentSpaceId] = store[currentSpaceId].filter(s => s.id !== id);
                localStorage.setItem('shortcuts_by_space', JSON.stringify(store));
                closeConfirmModal();
                renderShortcuts();
                showToast("Deleted");
            };
        }

        function closeConfirmModal() { document.getElementById('confirmModal').classList.add('hidden'); }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, -20px)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 0)';
            }, 2000);
        }
    </script>
</body>
</html>
